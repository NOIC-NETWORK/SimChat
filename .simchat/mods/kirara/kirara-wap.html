<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kirara|TeleVideo自研二次元AI副驾驶</title>
    <link rel="stylesheet" href="css/kirara-wap.css">
</head>
<body>
    <img id="backgroundImg" src="sprites/backgrounds/default.png">

    <button class="menu-toggle" id="menu-toggle">☰</button>

    <header class="wap-header" id="wap-header">
        <div class="header-top">
            <div class="header-left">
                <img src="sprites/logos/kirara.png" alt="Kirara Logo" class="logo-img">
                <div class="logo-text">
                    <h1>Kirara</h1>
                    <p>AI副驾驶</p>
                </div>
            </div>
            <button class="header-close" id="header-close">×</button>
        </div>
        <nav class="header-nav">
            <button class="nav-item" id="nav-costume">
                <span class="icon">🎨</span>
                <span>换装</span>
            </button>
            <button class="nav-item" id="nav-context">
                <span class="icon">📜</span>
                <span>上下文</span>
            </button>
            <button class="nav-item" id="nav-settings">
                <span class="icon">🔧</span>
                <span>设置</span>
            </button>
            <button class="nav-item" id="nav-clear">
                <span class="icon">📝</span>
                <span>新的对话</span>
            </button>
        </nav>
    </header>

    <section class="main-content">
        <div class="kirara-area">
            <div class="chat-container" id="chat-container">
                <div class="message ai">
                    <img src="sprites/logos/kirara-4.png" class="message-avatar">
                    <div class="message-bubble">您~好~❇！我是绮~罗~罗❤，我是你的AI副驾驶哦！有什么可以帮助您的吗？</div>
                </div>
            </div>
            <div class="kirara-container" id="kirara-container">
                <img src="sprites/characters/kirara/common/kirara-casual1-default.png" id="kirara-img" alt="Kirara">
            </div>
        </div>
    </section>

    <div class="input-area" id="input-area">
        <div class="input-wrapper">
            <textarea id="user-input" placeholder="输入您的消息..." autocomplete="off"></textarea>
            <button id="doc-btn" class="input-btn">📎</button>
            <button id="send-btn" class="input-btn">➤</button>
        </div>
    </div>

    <div class="modal-overlay" id="costume-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>🎨 换装</h2>
                <button class="modal-close" data-close="costume-modal">×</button>
            </div>
            <div class="modal-body">
                <div class="character-grid">
                    <div class="character-item" data-img="sprites/characters/kirara/common/kirara-casual1-default.png">
                        <img src="sprites/characters/kirara/common/kirara-casual1-default.png">
                        <div class="name">便装</div>
                    </div>
                    <div class="character-item" data-img="sprites/characters/kirara/common/kirara-sightseeing-default.png">
                        <img src="sprites/characters/kirara/common/kirara-sightseeing-default.png">
                        <div class="name">郊游服装</div>
                    </div>
                    <div class="character-item" data-img="sprites/characters/kirara/common/kirara-xmas-default.png">
                        <img src="sprites/characters/kirara/common/kirara-xmas-default.png">
                        <div class="name">圣诞节服装</div>
                    </div>
                    <div class="character-item" data-img="sprites/characters/kirara/common/kirara-catPajama-default.png">
                        <img src="sprites/characters/kirara/common/kirara-catPajama-default.png">
                        <div class="name">猫咪睡衣</div>
                    </div>
                    <div class="character-item" data-img="sprites/characters/kirara/common/kirara-swimsuit-default.png">
                        <img src="sprites/characters/kirara/common/kirara-swimsuit-default.png">
                        <div class="name">海洋装扮</div>
                    </div>
                    <div class="character-item" data-img="sprites/characters/kirara/common/kirara-qipao-default.png">
                        <img src="sprites/characters/kirara/common/kirara-qipao-default.png">
                        <div class="name">旗袍</div>
                    </div>
                    <div class="character-item" data-img="sprites/characters/kirara/common/kirara-common-default.png">
                        <img src="sprites/characters/kirara/common/kirara-common-default.png">
                        <div class="name">绮罗罗机甲 Mk.1</div>
                    </div>
                    <div class="character-item" data-img="sprites/characters/kirara/common/kirara-claw-default.png">
                        <img src="sprites/characters/kirara/common/kirara-claw-default.png">
                        <div class="name">海老名绮罗</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="context-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📜 上下文</h2>
                <button class="modal-close" data-close="context-modal">×</button>
            </div>
            <div class="modal-body">
                <div class="context-tabs">
                    <button class="context-tab active" data-tab="memories">📝 记忆</button>
                    <button class="context-tab" data-tab="config">📋 配置</button>
                </div>
                <div class="context-panel active" id="memories-panel">
                    <div id="memories-content">正在加载记忆...</div>
                </div>
                <div class="context-panel" id="config-panel">
                    <div id="config-content">正在加载配置...</div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="settings-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>🔧 设置</h2>
                <button class="modal-close" data-close="settings-modal">×</button>
            </div>
            <div class="modal-body">
                <div class="option-item">
                    <div class="option-label">
                        <span>温度</span>
                        <span id="temp-value">0.7</span>
                    </div>
                    <input type="range" class="option-slider" id="temperature-slider" min="0.1" max="1.0" step="0.1" value="0.7">
                </div>
                <div class="option-item">
                    <div class="option-label">
                        <span>主题</span>
                    </div>
                    <select id="theme-select">
                        <option value="default">默认紫色</option>
                        <option value="pink">粉色</option>
                        <option value="blue">蓝色</option>
                        <option value="green">绿色</option>
                    </select>
                </div>
            </div>
        </div>
    </div>
    <script src="js/kiraraGenCore.js"></script>
    <script>
        const menuToggle = document.getElementById('menu-toggle');
        const headerClose = document.getElementById('header-close');
        const wapHeader = document.getElementById('wap-header');
        const chatContainer = document.getElementById('chat-container');
        const kiraraImg = document.getElementById('kirara-img');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        let headerExpanded = false;

        menuToggle.addEventListener('click', () => {
            headerExpanded = true;
            wapHeader.classList.add('expanded');
            menuToggle.style.display = 'none';
        });

        headerClose.addEventListener('click', () => {
            headerExpanded = false;
            wapHeader.classList.remove('expanded');
            menuToggle.style.display = 'flex';
        });

        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => {
                const id = item.id;

                headerExpanded = false;
                wapHeader.classList.remove('expanded');
                menuToggle.style.display = 'flex';

                if (id === 'nav-costume') {
                    document.getElementById('costume-modal').classList.add('active');
                } else if (id === 'nav-context') {
                    document.getElementById('context-modal').classList.add('active');
                    loadContextData();
                } else if (id === 'nav-settings') {
                    document.getElementById('settings-modal').classList.add('active');
                } else if (id === 'nav-clear') {
                    clearConversation();
                }
            });
        });

        document.querySelectorAll('.modal-close').forEach(btn => {
            btn.addEventListener('click', () => {
                const modalId = btn.dataset.close;
                document.getElementById(modalId).classList.remove('active');
            });
        });

        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) {
                    overlay.classList.remove('active');
                }
            });
        });

        document.querySelectorAll('.character-item').forEach(item => {
            item.addEventListener('click', () => {
                const img = item.dataset.img;
                if (img) {
                    kiraraImg.src = img;
                    sessionStorage.setItem('currentOutfit', img);
                    sessionStorage.setItem('currentOutfitName', item.querySelector('.name').textContent);
                }
            });
        });

        document.querySelectorAll('.context-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                const tabName = tab.dataset.tab;
                document.querySelectorAll('.context-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.context-panel').forEach(p => p.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tabName + '-panel').classList.add('active');
            });
        });

        document.getElementById('temperature-slider').addEventListener('input', (e) => {
            document.getElementById('temp-value').textContent = e.target.value;
            window.temperature = parseFloat(e.target.value);
        });

        function addMessage(text, isUser = false) {
            const msgClass = isUser ? 'user-message' : 'ai-message';
            const avatarSrc = isUser 
                ? "sprites/logos/user-avatar.png"
                : "sprites/logos/kirara-4.png";
            
            const newMessage = document.createElement('div');
            newMessage.className = `message ${msgClass}`;
            
            const avatar = document.createElement('img');
            avatar.src = avatarSrc;
            avatar.className = 'message-avatar';
            
            const messageContentWrapper = document.createElement('div');
            messageContentWrapper.className = 'message-content-wrapper';
            
            const messageContent = document.createElement('div');
            messageContent.className = 'message-content';
            messageContent.textContent = text;
            
            const messageTime = document.createElement('div');
            messageTime.className = 'message-time';
            messageTime.textContent = '刚刚';
            
            messageContentWrapper.appendChild(messageContent);
            messageContentWrapper.appendChild(messageTime);
            newMessage.appendChild(avatar);
            newMessage.appendChild(messageContentWrapper);
            
            chatContainer.appendChild(newMessage);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function loadContextData() {
            const memoriesCookie = getCookie('kirara_memories');
            if (memoriesCookie) {
                try {
                    const memories = JSON.parse(decodeURIComponent(memoriesCookie));
                    if (memories && memories.length > 0) {
                        document.getElementById('memories-content').textContent = 
                            memories.map(m => m.content || m.text || JSON.stringify(m)).join('\n\n');
                    } else {
                        document.getElementById('memories-content').textContent = '暂无记忆';
                    }
                } catch (e) {
                    document.getElementById('memories-content').textContent = '暂无记忆';
                }
            } else {
                document.getElementById('memories-content').textContent = '暂无记忆';
            }
        }

        function getCookie(name) {
            const value = "; " + document.cookie;
            const parts = value.split("; " + name + "=");
            if (parts.length === 2) return parts.pop().split(";").shift();
            return null;
        }

        function setCookie(name, value, days) {
            const expires = new Date();
            expires.setTime(expires.getTime() + days * 24 * 60 * 60 * 1000);
            document.cookie = name + "=" + encodeURIComponent(value) + ";expires=" + expires.toUTCString() + ";path=/";
        }

        function clearConversation() {
            conversationHistory = [];
            chatContainer.innerHTML = '';
            addMessage('你好~我是Kirara！有什么可以帮助你的吗？', false);
        }

        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        sendBtn.addEventListener('click', sendMessage);

        async function sendMessage() {
            if (window.isGeneratingResponse) {
                return;
            }
            
            window.isGeneratingResponse = true;
            window.inputDisabled = true;
            userInput.disabled = true;
            sendBtn.disabled = true;

            const inputText = userInput.value.trim();
            if (inputText === '') {
                window.isGeneratingResponse = false;
                window.inputDisabled = false;
                userInput.disabled = false;
                sendBtn.disabled = false;
                return;
            }

            window.conversationHistory.push({ role: 'user', content: inputText });

            addMessage(inputText, true);

            userInput.value = '';
            userInput.style.height = 'auto';

            startSpectrumAnimation();

            if (window.khsStat) {
                window.khsStat.textContent = "Kirara Halo System: Generating...";
            }

            try {
                const response = await fetch('/api/kirara/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message: inputText, 
                        content: inputText,
                        modelType: window.modelType || 'kirara-router',
                        temperature: window.temperature || 0.7
                    })
                });
                
                const data = await response.json();
                const aiResponse = data.response || data.message || data.content || '抱歉，我现在有点忙...';
                
                window.conversationHistory.push({ role: 'assistant', content: aiResponse });
                addMessage(aiResponse, false);
                
                if (data.memory) {
                    setCookie('kirara_memories', JSON.stringify(data.memory), 30);
                }
                
                kiraraImg.style.transform = 'scale(1.03)';
                setTimeout(() => {
                    kiraraImg.style.transform = 'scale(1)';
                }, 300);
                
            } catch (error) {
                console.error('API调用错误:', error);
                addMessage(`😢 抱歉，处理请求时出现错误: ${error.message}`, false);
            } finally {
                stopSpectrumAnimation();
                
                if (window.khsStat) {
                    window.khsStat.textContent = "Kirara Halo System: Non Active";
                }
                
                window.isGeneratingResponse = false;
                window.inputDisabled = false;
                userInput.disabled = false;
                sendBtn.disabled = false;
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            const savedOutfit = sessionStorage.getItem('currentOutfit');
            if (savedOutfit && kiraraImg) {
                kiraraImg.src = savedOutfit;
            }
        });
    </script>
</body>
</html>
