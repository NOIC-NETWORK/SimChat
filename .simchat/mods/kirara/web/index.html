<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kirara · 桌宠预览</title>
<style>
  :root{
    --ink:#1c1f2b;
    --glass:rgba(255,255,255,.72);
    --ease:cubic-bezier(.2,.9,.3,1.25);

    /* Kirara 按钮视觉语言（对齐 kirara.html 侧边栏 .nav-btn）
       页面内独立定义，不与 kirara-wap.css 互相影响 */
    --k-btn-bg:linear-gradient(135deg,#ffffff,#f0f0f0);
    --k-btn-bg-active:linear-gradient(135deg,#ffd700,#ffb347);
    --k-btn-border:#ff69b4;
    --k-btn-border-hover:#ffd700;
    --k-btn-radius:25px;
    --k-btn-radius-round:50%;
    --k-btn-color:#8a2be2;
    --k-btn-font-size:12px;
    --k-btn-font-weight:600;
    --k-btn-icon-size:22px;
    --k-btn-shadow-hover:0 5px 20px rgba(255,105,180,.4);
    --k-btn-shadow-active:0 5px 20px rgba(255,215,0,.5);
    --k-btn-transition:all .3s ease;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;overflow:hidden;}
  body{
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    color:#fff;background:#08090f;
    -webkit-user-select:none;user-select:none;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- 桌面背景 ---------- */
  .desktop{position:fixed;inset:0;overflow:hidden;
    background:radial-gradient(130% 105% at 50% -10%,#2c3766 0%,#161a2e 46%,#08090f 100%);
  }
  .desktop::after{
    content:"";position:absolute;inset:0;
    background:radial-gradient(58% 48% at 50% 44%,rgba(255,255,255,.10),rgba(255,255,255,0) 70%);
  }
  .blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;}
  .b1{width:62vw;height:62vw;left:-14vw;top:-28vw;background:radial-gradient(circle,#7c6bff,transparent 66%);}
  .b2{width:56vw;height:56vw;right:-14vw;top:-18vw;background:radial-gradient(circle,#39b7ff,transparent 66%);}
  .b3{width:74vw;height:52vw;left:16vw;bottom:-34vw;background:radial-gradient(circle,#ff6fae,transparent 66%);opacity:.3;}

  /* ---------- 顶部提示 ---------- */
  .topbar{
    position:fixed;top:18px;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:14px;
    padding:8px 16px;border-radius:999px;
    background:rgba(14,16,26,.42);
    border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(20px) saturate(140%);
    -webkit-backdrop-filter:blur(20px) saturate(140%);
    box-shadow:0 12px 30px rgba(0,0,0,.28);
    font-size:12.5px;letter-spacing:.3px;z-index:40;white-space:nowrap;
  }
  .brand{display:flex;align-items:center;gap:8px;font-weight:600;}
  .brand .dotstar{
    width:9px;height:9px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff,#ffd76e 55%,#ff9f43);
    box-shadow:0 0 10px rgba(255,205,110,.9);
  }
  .brand small{font-weight:400;color:rgba(255,255,255,.55);letter-spacing:1px;}
  .hint{color:rgba(255,255,255,.5);font-size:12px;}
  .hint b{color:rgba(255,255,255,.78);font-weight:500;}

  /* ---------- 桌宠本体 ---------- */
  #pet{
    position:absolute;left:50%;top:55%;width:300px;height:600px;
    z-index:10;cursor:grab;touch-action:none;
    will-change:left,top,width,height;
  }
  #pet.dragging{cursor:grabbing;}
  #petFloat{position:absolute;inset:0;animation:floaty 4.8s ease-in-out infinite;}
  @keyframes floaty{0%,100%{transform:translateY(1px);}50%{transform:translateY(-9px);}}
  #petImg{
    width:100%;height:100%;object-fit:contain;display:block;
    pointer-events:none;
    filter:drop-shadow(0 26px 34px rgba(0,0,0,.42));
    transition:border-radius .25s ease,box-shadow .25s ease;
  }
  #pet.is-orb #petImg{
    border-radius:50%;
    box-shadow:0 0 46px rgba(150,128,255,.6),0 0 0 1px rgba(255,255,255,.35);
  }
  #petShadow{
    position:absolute;left:50%;bottom:-8px;width:62%;height:7%;
    transform:translateX(-50%);
    background:radial-gradient(ellipse at center,rgba(0,0,0,.55),rgba(0,0,0,0) 72%);
    filter:blur(7px);z-index:-1;
  }

  /* ---------- 对话气泡 ---------- */
  .bubble{
    position:absolute;left:50%;bottom:calc(100% + 18px);
    transform:translate(-50%,10px) scale(.94);
    transform-origin:50% 100%;
    max-width:290px;width:max-content;
    opacity:0;pointer-events:none;
    transition:opacity .22s ease,transform .28s var(--ease);
    z-index:30;
  }
  .bubble.show{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto;}
  .bubble-card{
    position:relative;
    padding:13px 17px 14px;
    border-radius:16px;
    background:rgba(252,252,255,.86);
    border:1px solid rgba(255,255,255,.9);
    color:var(--ink);
    font-size:13.5px;line-height:1.62;letter-spacing:.2px;
    box-shadow:0 16px 38px rgba(0,0,0,.34),0 1px 0 rgba(255,255,255,.9) inset;
    backdrop-filter:blur(22px) saturate(150%);
    -webkit-backdrop-filter:blur(22px) saturate(150%);
  }
  .bubble-card::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
    border-radius:16px 0 0 16px;
    background:linear-gradient(180deg,#ffd36e,#ff9fb2 55%,#a996ff);
  }
  .bubble-card::after{
    content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:12px;
    transform:translateX(-50%) rotate(45deg);
    background:rgba(252,252,255,.86);
    border-right:1px solid rgba(255,255,255,.9);
    border-bottom:1px solid rgba(255,255,255,.9);
    border-radius:0 0 3px 0;
  }
  .bubble-name{
    display:flex;align-items:center;gap:6px;
    font-size:11px;letter-spacing:1.4px;color:#8a7bc8;font-weight:600;
    margin-bottom:5px;text-transform:uppercase;
  }
  .bubble-name i{
    width:6px;height:6px;border-radius:50%;background:#ffd36e;
    box-shadow:0 0 8px #ffca4d;
  }
  .bubble-text{animation:lineIn .28s ease;}
  @keyframes lineIn{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:none;}}

  /* ---------- Kirara 风格圆形按钮（对齐 .nav-btn） ---------- */
  .ring{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none;z-index:25;}
  .orb-btn{
    --tx:0px;--ty:0px;--d:0s;
    position:absolute;left:50%;top:50%;
    width:56px;height:56px;border-radius:var(--k-btn-radius-round);
    display:grid;place-items:center;
    padding:0;border:2px solid var(--k-btn-border);
    background:var(--k-btn-bg);
    color:var(--k-btn-color);
    box-shadow:0 12px 22px rgba(0,0,0,.28);
    opacity:0;pointer-events:none;
    transform:translate(-50%,-50%) translate(var(--tx),var(--ty)) scale(.9);
    translate:0 0;
    transition:opacity .18s ease,transform .2s ease,translate .3s ease,box-shadow .3s ease,border-color .3s ease;
    cursor:pointer;
  }
  .ring.open .orb-btn{
    opacity:1;pointer-events:auto;
    animation:popIn .42s var(--ease) both;
    animation-delay:var(--d);
  }
  @keyframes popIn{
    from{opacity:0;transform:translate(-50%,-50%) translate(var(--tx),var(--ty)) scale(.3);}
    to{opacity:1;transform:translate(-50%,-50%) translate(var(--tx),var(--ty)) scale(1);}
  }
  .ring.open .orb-btn:hover{
    translate:0 -3px;
    border-color:var(--k-btn-border-hover);
    box-shadow:var(--k-btn-shadow-hover);
  }
  .ring.open .orb-btn:active{
    translate:0 0;
    background:var(--k-btn-bg-active);
    border-color:var(--k-btn-border-hover);
    box-shadow:var(--k-btn-shadow-active);
  }
  .orb-btn:focus-visible{outline:2px solid var(--k-btn-color);outline-offset:3px;}
  .orb-btn svg{width:var(--k-btn-icon-size);height:var(--k-btn-icon-size);display:block;filter:drop-shadow(0 1px 2px rgba(138,43,226,.35));}
  .orb-btn::after{
    content:attr(data-label);
    position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%) translateY(-2px);
    padding:3px 8px;border-radius:999px;white-space:nowrap;
    font-size:10.5px;letter-spacing:.5px;color:rgba(255,255,255,.9);
    background:rgba(12,14,22,.66);border:1px solid rgba(255,255,255,.14);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    opacity:0;pointer-events:none;transition:opacity .16s ease,transform .16s ease;
  }
  .ring.open .orb-btn:hover::after{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ---------- 左下角形态面板 ---------- */
  .dock{
    position:fixed;left:22px;bottom:22px;z-index:35;
    width:246px;padding:14px 14px 12px;
    border-radius:18px;
    background:rgba(12,14,24,.44);
    border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(22px) saturate(140%);
    -webkit-backdrop-filter:blur(22px) saturate(140%);
    box-shadow:0 16px 40px rgba(0,0,0,.3);
  }
  .dock-title{
    display:flex;align-items:center;justify-content:space-between;
    font-size:11px;letter-spacing:1.6px;color:rgba(255,255,255,.5);
    margin-bottom:10px;text-transform:uppercase;
  }
  .dock-title span{letter-spacing:.4px;color:rgba(255,255,255,.32);font-size:10px;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    padding:7px 14px;border-radius:var(--k-btn-radius);
    font-size:var(--k-btn-font-size);line-height:1.2;letter-spacing:.2px;
    font-weight:var(--k-btn-font-weight);color:var(--k-btn-color);
    background:var(--k-btn-bg);
    border:2px solid var(--k-btn-border);
    cursor:pointer;transition:var(--k-btn-transition);
  }
  .chip:hover{
    transform:translateY(-3px);
    border-color:var(--k-btn-border-hover);
    box-shadow:var(--k-btn-shadow-hover);
  }
  .chip:active{
    transform:translateY(-1px) scale(.98);
    background:var(--k-btn-bg-active);
    border-color:var(--k-btn-border-hover);
    box-shadow:var(--k-btn-shadow-active);
  }
  .chip.active{
    background:var(--k-btn-bg-active);color:var(--k-btn-color);
    border-color:var(--k-btn-border-hover);
    box-shadow:var(--k-btn-shadow-active);
  }
  .dock-foot{
    display:flex;align-items:center;justify-content:space-between;
    margin-top:12px;padding-top:10px;
    border-top:1px solid rgba(255,255,255,.1);
    font-size:11px;color:rgba(255,255,255,.45);letter-spacing:.4px;
  }
  .dock-foot button{
    font:inherit;font-size:var(--k-btn-font-size);font-weight:var(--k-btn-font-weight);
    color:var(--k-btn-color);
    background:var(--k-btn-bg);border:2px solid var(--k-btn-border);
    border-radius:var(--k-btn-radius);padding:8px 16px;cursor:pointer;
    transition:var(--k-btn-transition);
  }
  .dock-foot button:hover{
    transform:translateY(-3px);
    border-color:var(--k-btn-border-hover);
    box-shadow:var(--k-btn-shadow-hover);
  }
  .dock-foot button:active{
    transform:translateY(-1px) scale(.96);
    background:var(--k-btn-bg-active);
    border-color:var(--k-btn-border-hover);
    box-shadow:var(--k-btn-shadow-active);
  }

  /* ---------- Toast ---------- */
  .toast{
    position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(12px);
    padding:9px 16px;border-radius:999px;
    font-size:12.5px;letter-spacing:.3px;color:rgba(255,255,255,.92);
    background:rgba(16,18,28,.7);
    border:1px solid rgba(255,255,255,.16);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    box-shadow:0 12px 30px rgba(0,0,0,.3);
    opacity:0;pointer-events:none;transition:opacity .22s ease,transform .28s var(--ease);
    z-index:60;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media (max-width:560px){
    .hint{display:none;}
    .dock{width:calc(100vw - 32px);left:16px;bottom:16px;}
    .topbar{top:14px;}
  }
</style>
</head>
<body>

<div class="desktop">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
</div>

<header class="topbar">
  <div class="brand"><span class="dotstar"></span>Kirara <small>桌宠预览</small></div>
  <div class="hint">点击<b>立绘</b> · 拖动<b>移动</b> · 滚轮<b>缩放</b></div>
</header>

<div id="pet">
  <div id="petShadow"></div>
  <div id="petFloat"><img id="petImg" alt="Kirara 桌宠立绘" draggable="false"></div>
  <div id="bubble" class="bubble">
    <div class="bubble-card">
      <div class="bubble-name"><i></i>KIRARA</div>
      <div class="bubble-text" id="bubbleText"></div>
    </div>
  </div>
  <div id="ring" class="ring"></div>
</div>

<aside class="dock" id="dock">
  <div class="dock-title">形态 / 变体 <span>FORM</span></div>
  <div class="chips" id="chips"></div>
  <div class="dock-foot">
    <span id="zoomLabel">缩放 100%</span>
    <button type="button" id="dockReset">归位</button>
  </div>
</aside>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  var CHAR_BASE = "sprites/characters/kirara/common/";
  var LOGO_SRC = "sprites/logos/kirara.png";

  var VARIANTS = [
    { id: "common", name: "默认", src: CHAR_BASE + "kirara-common-default.png" },
    { id: "casual1", name: "休闲", src: CHAR_BASE + "kirara-casual1-default.png" },
    { id: "catPajama", name: "猫睡衣", src: CHAR_BASE + "kirara-catPajama-default.png" },
    { id: "claw", name: "爪", src: CHAR_BASE + "kirara-claw-default.png" },
    { id: "netrunner", name: "网络行者", src: CHAR_BASE + "kirara-netrunner-default.png" },
    { id: "qipao", name: "旗袍", src: CHAR_BASE + "kirara-qipao-default.png" },
    { id: "sightseeing", name: "观光", src: CHAR_BASE + "kirara-sightseeing-default.png" },
    { id: "swimsuit", name: "泳装", src: CHAR_BASE + "kirara-swimsuit-default.png" },
    { id: "xmas", name: "圣诞", src: CHAR_BASE + "kirara-xmas-default.png" }
  ];

  var LINES = [
    "欢迎回来。今天想听点星屑级的小知识吗？",
    "唔……你刚才戳到我的光环了。不过，没关系。",
    "占卜结果：你今天会喝到一杯温度刚好的水。",
    "这颗星说别熬夜了。是它说的，不是我说的。",
    "房间的温度我已经记住了，下次直接问我。",
    "无聊的话，把我拖到屏幕角落就好——我不会乱跑的。"
  ];

  var BASE_H = 600;              // 立绘基准高度
  var ASPECT = 2023 / 3821;      // 素材宽高比
  var ORB_SIZE = 250;            // 圆球形态基准尺寸
  var SCALE_MIN = 0.35;
  var SCALE_MAX = 2.0;

  var pet = document.getElementById("pet");
  var petImg = document.getElementById("petImg");
  var ring = document.getElementById("ring");
  var bubble = document.getElementById("bubble");
  var bubbleText = document.getElementById("bubbleText");
  var chips = document.getElementById("chips");
  var zoomLabel = document.getElementById("zoomLabel");
  var toastEl = document.getElementById("toast");
  var dock = document.getElementById("dock");

  var state = {
    s: 1,
    s0: 1,
    x: window.innerWidth / 2,
    y: window.innerHeight * 0.56,
    open: false,
    form: "sprite",
    variant: VARIANTS[0],
    line: 0
  };

  /* ---------- 尺寸与布局 ---------- */

  function dims() {
    var s = state.s;
    return state.form === "orb"
      ? { w: ORB_SIZE * s, h: ORB_SIZE * s }
      : { w: BASE_H * ASPECT * s, h: BASE_H * s };
  }

  function clampPosition(w, h) {
    var margin = 70;
    var halfW = w / 2;
    var halfH = h / 2;
    var minX = halfW - w + margin;
    var maxX = window.innerWidth - halfW + w - margin;
    var minY = halfH - h + margin;
    var maxY = window.innerHeight - halfH + h - margin;
    state.x = Math.min(Math.max(state.x, minX), maxX);
    state.y = Math.min(Math.max(state.y, minY), maxY);
  }

  function setPosition(w, h) {
    pet.style.left = (state.x - w / 2) + "px";
    pet.style.top = (state.y - h / 2) + "px";
  }

  var ANGLES = [-52, 0, 52, 128, 180, 232];

  function layoutRing(w, h) {
    var rx = w / 2 + 52;
    var ry = state.form === "orb" ? h * 0.48 : h * 0.36;
    var btns = ring.children;
    for (var i = 0; i < btns.length; i++) {
      var a = ANGLES[i] * Math.PI / 180;
      btns[i].style.setProperty("--tx", (Math.cos(a) * rx).toFixed(1) + "px");
      btns[i].style.setProperty("--ty", (Math.sin(a) * ry).toFixed(1) + "px");
    }
  }

  function apply() {
    var d = dims();
    clampPosition(d.w, d.h);
    pet.style.width = d.w + "px";
    pet.style.height = d.h + "px";
    setPosition(d.w, d.h);
    pet.classList.toggle("is-orb", state.form === "orb");
    layoutRing(d.w, d.h);
    zoomLabel.textContent = "缩放 " + Math.round(state.s / state.s0 * 100) + "%";
  }

  /* ---------- 气泡 ---------- */

  function showLine(advance) {
    if (advance) state.line = (state.line + 1) % LINES.length;
    bubbleText.textContent = LINES[state.line];
    bubbleText.style.animation = "none";
    void bubbleText.offsetWidth;
    bubbleText.style.animation = "";
  }

  function openPanel() {
    state.open = true;
    pet.classList.add("open");
    ring.classList.add("open");
    bubble.classList.add("show");
    showLine(false);
  }

  function closePanel() {
    state.open = false;
    ring.classList.remove("open");
    bubble.classList.remove("show");
    pet.classList.remove("open");
  }

  function onPetTap() {
    if (!state.open) {
      openPanel();
    } else {
      showLine(true);
    }
  }

  /* ---------- 缩放 ---------- */

  function zoom(factor) {
    state.s = Math.min(SCALE_MAX, Math.max(SCALE_MIN, state.s * factor));
    apply();
  }

  function resetPet() {
    state.s = state.s0;
    state.x = window.innerWidth / 2;
    state.y = window.innerHeight * 0.56;
    apply();
    toast("已归位到屏幕中央");
  }

  /* ---------- 形态 ---------- */

  function syncChips() {
    var nodes = chips.children;
    for (var i = 0; i < nodes.length; i++) {
      var el = nodes[i];
      var on = el.dataset.kind === "orb"
        ? state.form === "orb"
        : (state.form === "sprite" && el.dataset.id === state.variant.id);
      el.classList.toggle("active", on);
    }
  }

  function setSprite(variant) {
    state.form = "sprite";
    state.variant = variant;
    petImg.src = variant.src;
    petImg.alt = "Kirara · " + variant.name;
    apply();
    syncChips();
  }

  function setOrb() {
    state.form = "orb";
    petImg.src = LOGO_SRC;
    petImg.alt = "Kirara 圆球形态";
    apply();
    syncChips();
  }

  function toggleForm() {
    if (state.form === "orb") {
      setSprite(state.variant);
      toast("形态：立绘 · " + state.variant.name);
    } else {
      setOrb();
      toast("形态：圆球");
    }
  }

  /* ---------- Toast ---------- */

  var toastTimer = 0;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastEl.classList.remove("show");
    }, 1800);
  }

  /* ---------- 按钮 ---------- */

  var ICONS = {
    talk: '<path d="M20.5 11.6a8.2 8.2 0 0 1-11.9 7.3L4 20l1.2-4.4A8.2 8.2 0 1 1 20.5 11.6Z"/><path d="M9 11.5h6M9 14.5h3.5"/>',
    form: '<path d="m12 3 2.5 5.7 6.1.5-4.6 4 1.4 6-5.4-3.2L6.6 19.2l1.4-6-4.6-4 6.1-.5Z"/>',
    zoomIn: '<circle cx="10.8" cy="10.8" r="6.3"/><path d="M15.4 15.4 20.5 20.5M8 10.8h5.6M10.8 8v5.6"/>',
    zoomOut: '<circle cx="10.8" cy="10.8" r="6.3"/><path d="M15.4 15.4 20.5 20.5M8 10.8h5.6"/>',
    wish: '<path d="M12 3.2 13.5 9l5.8 1.5-5.8 1.5L12 17.8l-1.5-5.8L4.7 10.5 10.5 9Z"/><path d="M18.4 16.2l.7 2.4 2.4.7-2.4.7-.7 2.4-.7-2.4-2.4-.7 2.4-.7Z"/>',
    reset: '<path d="M4.5 12a7.5 7.5 0 1 0 2.3-5.4"/><path d="M4.2 4.6v4.2h4.2"/><path d="M10.2 13.9 9.5 9.7 12 12l2.5-2.3-.7 4.2Z" opacity=".85"/>'
  };

  var BUTTONS = [
    { key: "talk", label: "说句话", tint: "rgba(255,140,168,.55)", glow: "rgba(255,120,155,.55)", icon: ICONS.talk },
    { key: "form", label: "切换形态", tint: "rgba(255,206,110,.55)", glow: "rgba(255,196,80,.5)", icon: ICONS.form },
    { key: "zoomIn", label: "放大", tint: "rgba(122,215,160,.55)", glow: "rgba(96,214,142,.5)", icon: ICONS.zoomIn },
    { key: "zoomOut", label: "缩小", tint: "rgba(120,190,255,.55)", glow: "rgba(90,172,255,.5)", icon: ICONS.zoomOut },
    { key: "wish", label: "星愿（占位）", tint: "rgba(190,160,255,.55)", glow: "rgba(174,138,255,.55)", icon: ICONS.wish },
    { key: "reset", label: "归位", tint: "rgba(236,239,247,.5)", glow: "rgba(220,228,245,.45)", icon: ICONS.reset }
  ];

  function buildRing() {
    BUTTONS.forEach(function (cfg, i) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "orb-btn";
      b.dataset.label = cfg.label;
      b.setAttribute("aria-label", cfg.label);
      b.style.setProperty("--tint", cfg.tint);
      b.style.setProperty("--glow", cfg.glow);
      b.style.setProperty("--d", (i * 0.045).toFixed(3) + "s");
      b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' + cfg.icon + "</svg>";
      b.addEventListener("click", function (e) {
        e.stopPropagation();
        handleAction(cfg.key);
      });
      b.addEventListener("pointerdown", function (e) { e.stopPropagation(); });
      ring.appendChild(b);
    });
  }

  function handleAction(key) {
    switch (key) {
      case "talk":
        if (!state.open) openPanel(); else onPetTap();
        break;
      case "form":
        toggleForm();
        break;
      case "zoomIn":
        zoom(1.1);
        break;
      case "zoomOut":
        zoom(1 / 1.1);
        break;
      case "wish":
        toast("星愿系统为占位功能，尚未接入");
        break;
      case "reset":
        resetPet();
        break;
    }
  }

  /* ---------- 变体面板 ---------- */

  function buildChips() {
    VARIANTS.forEach(function (v) {
      var c = document.createElement("button");
      c.type = "button";
      c.className = "chip";
      c.dataset.id = v.id;
      c.dataset.kind = "sprite";
      c.textContent = v.name;
      c.addEventListener("click", function () { setSprite(v); });
      chips.appendChild(c);
    });
    var orb = document.createElement("button");
    orb.type = "button";
    orb.className = "chip";
    orb.dataset.kind = "orb";
    orb.textContent = "圆球形态";
    orb.addEventListener("click", function () { setOrb(); });
    chips.appendChild(orb);
  }

  /* ---------- 拖动与点击 ---------- */

  var drag = null;

  pet.addEventListener("pointerdown", function (e) {
    if (e.target.closest(".orb-btn")) return;
    if (e.pointerType === "mouse" && e.button !== 0) return;
    drag = { id: e.pointerId, sx: e.clientX, sy: e.clientY, px: state.x, py: state.y, moved: false };
    try { pet.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
    pet.classList.add("dragging");
  });

  pet.addEventListener("pointermove", function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    var dx = e.clientX - drag.sx;
    var dy = e.clientY - drag.sy;
    if (!drag.moved && Math.sqrt(dx * dx + dy * dy) > 4) drag.moved = true;
    if (!drag.moved) return;
    state.x = drag.px + dx;
    state.y = drag.py + dy;
    var d = dims();
    clampPosition(d.w, d.h);
    setPosition(d.w, d.h);
  });

  function endDrag(e) {
    if (!drag) return;
    var moved = drag.moved;
    drag = null;
    pet.classList.remove("dragging");
    if (!moved) onPetTap();
  }

  pet.addEventListener("pointerup", endDrag);
  pet.addEventListener("pointercancel", endDrag);

  pet.addEventListener("wheel", function (e) {
    e.preventDefault();
    zoom(e.deltaY < 0 ? 1.09 : 1 / 1.09);
  }, { passive: false });

  document.addEventListener("pointerdown", function (e) {
    if (!state.open) return;
    if (pet.contains(e.target) || dock.contains(e.target)) return;
    closePanel();
  }, true);

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closePanel();
    if (e.key === "+" || e.key === "=") zoom(1.1);
    if (e.key === "-") zoom(1 / 1.1);
    if (e.key === "r" || e.key === "R") resetPet();
  });

  window.addEventListener("resize", function () { apply(); });

  /* ---------- 初始化 ---------- */

  document.getElementById("dockReset").addEventListener("click", resetPet);

  buildChips();
  buildRing();

  state.s0 = Math.min(1.05, Math.max(0.55, (window.innerHeight * 0.62) / BASE_H));
  state.s = state.s0;
  state.x = window.innerWidth / 2;
  state.y = window.innerHeight * 0.56;

  petImg.src = state.variant.src;
  petImg.alt = "Kirara · " + state.variant.name;
  apply();
  syncChips();
})();
</script>
</body>
</html>
