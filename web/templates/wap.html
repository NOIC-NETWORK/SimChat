<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>SimChat · Mobile</title>
<link rel="stylesheet" href="/static/css/wap.css">
</head>
<body data-app="wap" data-theme="light">

<!-- ============ Splash Screen ============ -->
<div class="mob-splash" id="mob-splash">
  <div class="mob-splash-inner">
    <div class="mob-splash-logo">
      <svg viewBox="0 0 120 120" width="86" height="86" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="60" cy="60" r="54" fill="none" stroke="currentColor" stroke-opacity="0.18"/>
        <circle cx="60" cy="60" r="44" fill="none" stroke="currentColor" stroke-opacity="0.28"/>
        <path d="M60 17 70.5 50 104.5 60 70.5 70 60 103 49.5 70 15.5 60 49.5 50Z" fill="currentColor" fill-opacity="0.9" stroke="none"/>
      </svg>
    </div>
    <div class="mob-splash-title">SimChat</div>
    <div class="mob-splash-sub">你的本地 AI 副驾驶</div>
    <div class="mob-splash-loader">
      <div class="mob-splash-bar"><div class="mob-splash-fill" id="splash-fill"></div></div>
      <div class="mob-splash-hint" id="splash-hint">正在加载模型…</div>
    </div>
    <button class="mob-splash-skip" id="splash-skip" hidden>跳过</button>
  </div>
</div>

<div class="mobile-shell" id="mob-shell" hidden>

  <!-- 顶部标题栏 -->
  <header class="mob-head" id="mob-head">
    <button class="mob-back" id="mob-back" aria-label="返回" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <div class="mob-title" id="mob-title">SimChat</div>
    <div class="mob-right" id="mob-head-right"></div>
  </header>

  <!-- 主内容堆栈 -->
  <div class="mob-stack">

    <!-- ① 会话列表 -->
    <section class="mob-screen active" data-route="sessions">
      <div class="mob-session-list" id="mob-session-list"></div>
    </section>

    <!-- ② 对话页 -->
    <section class="mob-screen" data-route="chat">
      <div class="mob-chat-body" id="mob-chat-messages"></div>
      <div class="mob-chat-footer">
        <div class="lock-banner hidden" id="mob-lock-banner">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <div class="grow"><b>工作目录未配置</b></div>
        </div>
        <div class="composer-box" id="mob-composer-box">
          <textarea id="mob-composer-input" rows="2" placeholder="向 SimChat 提问…"></textarea>
          <div class="composer-bar">
            <span class="comp-btn" id="mob-mode-switch">对话</span>
            <div class="grow"></div>
            <button class="send-btn" id="mob-send" title="发送" aria-label="发送">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12 16-7-5 7 5 7z"/></svg>
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- ③ 任务页 -->
    <section class="mob-screen" data-route="tasks">
      <div class="mob-task-body" id="mob-task-list">
        <div class="mob-session-empty">
          <div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.2 2"/></svg></div>
          <h3>还没有 Agent 运行</h3>
          <p>在对话页切换到 Agent 模式来触发任务</p>
        </div>
      </div>
    </section>

    <!-- ④ 我的页 -->
    <section class="mob-screen" data-route="me">
      <div class="mob-me-body">

        <div class="mob-me-section">
          <div class="mob-me-section-title">当前状态</div>
          <div class="mob-me-card">
            <div class="mob-me-row selectable" id="mob-me-model-row">
              <div class="grow">
                <div class="label">模型</div>
                <div class="sub mono" id="mob-me-model">加载中…</div>
              </div>
              <span class="arrow"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg></span>
            </div>
            <!-- 模型选项组（内联展开，非弹层） -->
            <div class="mob-me-choices hidden" id="mob-model-choices"></div>

            <div class="mob-me-row selectable" id="mob-me-ws-row">
              <div class="grow">
                <div class="label">工作目录</div>
                <div class="sub" id="mob-me-ws-path">未配置</div>
              </div>
              <div class="value" id="mob-me-ws-status">—</div>
              <span class="arrow"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg></span>
            </div>

            <div class="mob-me-row">
              <div class="grow">
                <div class="label">默认模式</div>
                <div class="sub" id="mob-me-mode">对话</div>
              </div>
            </div>
          </div>
        </div>

        <div class="mob-me-section">
          <div class="mob-me-section-title">外观</div>
          <div class="mob-me-card">
            <div class="mob-me-row selectable" id="mob-me-theme-row">
              <div class="grow">
                <div class="label">主题</div>
                <div class="sub" id="mob-me-theme-label">跟随系统</div>
              </div>
              <span class="arrow"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg></span>
            </div>
            <!-- 主题选项组（内联展开） -->
            <div class="mob-me-choices hidden" id="mob-theme-choices"></div>

            <div class="mob-me-row selectable" id="mob-me-exit">
              <div class="grow">
                <div class="label">返回桌面版</div>
                <div class="sub">SimChat IDE</div>
              </div>
              <span class="arrow"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg></span>
            </div>
          </div>
        </div>

        <div class="mob-me-section">
          <div class="mob-me-section-title">关于</div>
          <div class="mob-me-card">
            <div class="mob-me-row">
              <div class="grow">
                <div class="label">SimChat Mobile</div>
                <div class="sub">WAP 版 · 从桌面版共享 /api/*</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ⑤ 工作目录选择器（独立 route，不走弹层） -->
    <section class="mob-screen" data-route="ws-picker">
      <div class="mob-ws-body">
        <div class="mob-me-section">
          <div class="mob-me-section-title">当前路径</div>
          <div class="mob-ws-path" id="mob-ws-current">—</div>
        </div>
        <div class="mob-me-section">
          <div class="mob-me-section-title">根目录</div>
          <div class="mob-me-card" id="mob-ws-roots"></div>
        </div>
        <div class="mob-me-section">
          <div class="mob-me-section-title">目录内容 <span style="text-transform:none;letter-spacing:0;font-size:10px">只列目录与文件名</span></div>
          <div class="mob-me-card" id="mob-ws-entries"></div>
          <div class="mob-ws-actions">
            <button class="btn sm ghost" id="mob-ws-up">上一级</button>
            <button class="btn sm ghost" id="mob-ws-clear" style="color:var(--danger)">清除</button>
            <div class="grow"></div>
            <button class="btn sm primary" id="mob-ws-use">使用此目录</button>
          </div>
        </div>
      </div>
    </section>

  </div>

  <!-- 底部 TabBar -->
  <nav class="mob-tabbar" aria-label="主导航">
    <button class="mob-tab" data-tab="sessions" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 21l1.9-5.4A8 8 0 1 1 21 12Z"/></svg>
      <span>对话</span>
    </button>
    <button class="mob-tab" data-tab="tasks" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1.2 1.2L7 4.8"/></svg>
      <span>任务</span>
    </button>
    <button class="mob-tab" data-tab="me" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
      <span>我的</span>
    </button>
  </nav>

  <div class="toasts" id="mob-toasts"></div>

</div>

<script src="/static/js/ide-api.js"></script>
<script src="/static/js/wap.js?v=2"></script>
</body>
</html>
