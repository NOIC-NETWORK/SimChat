<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 · SimChat</title>
  <link rel="stylesheet" href="/static/css/chat.css">
  <style>
    /* 注册页专用覆盖：复用 chat.css 变量，简化视觉层次 */
    :root { --accent: #4a9eff; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg, #0f0f0f);
      color: var(--text, #e8e8e8);
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }
    .register-card {
      width: 440px;
      max-width: calc(100vw - 48px);
      border-radius: 16px;
      padding: 40px 36px 32px;
      background: var(--bg-elevated, #1a1a1a);
      border: 1px solid var(--border, #2a2a2a);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .register-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .register-logo {
      width: 48px; height: 48px;
      border-radius: 12px;
      background: linear-gradient(135deg, #4a9eff, #a080ff);
      margin: 0 auto 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; color: #fff; font-weight: 700;
    }
    .register-title { font-size: 20px; font-weight: 700; margin: 0 0 6px; }
    .register-sub { font-size: 13px; color: var(--text-muted, #999); margin: 0; }
    .register-field { margin-bottom: 16px; }
    .register-field label {
      display: block; font-size: 12px; font-weight: 600;
      color: var(--text-muted, #999); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em;
    }
    .register-field label .req { color: #f44; }
    .register-field input {
      width: 100%; box-sizing: border-box; height: 38px;
      padding: 0 12px; border-radius: 8px;
      background: var(--bg, #0f0f0f); color: var(--text, #e8e8e8);
      border: 1px solid var(--border, #2a2a2a);
      font-size: 14px; font-family: inherit;
      outline: none; transition: border-color 0.15s;
    }
    .register-field input:focus { border-color: var(--accent); }
    .register-field input::placeholder { color: var(--text-muted, #666); }
    .register-field.optional label .opt {
      color: var(--text-muted, #666); font-weight: 400; text-transform: none; letter-spacing: 0;
      font-size: 11px;
    }
    .register-divider {
      display: flex; align-items: center; gap: 12px;
      margin: 24px 0 20px; color: var(--text-muted, #666); font-size: 12px;
    }
    .register-divider::before, .register-divider::after {
      content: ""; flex: 1; height: 1px; background: var(--border, #2a2a2a);
    }
    .register-provider-hint {
      font-size: 12px; color: var(--text-muted, #777);
      text-align: center; margin-top: 0;
    }
    .register-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 24px; }
    .register-submit {
      height: 42px; border-radius: 10px; border: none;
      background: var(--accent); color: #fff; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: filter 0.15s;
    }
    .register-submit:hover { filter: brightness(1.15); }
    .register-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .register-skip {
      background: transparent; border: none; color: var(--text-muted, #999);
      font-size: 12px; cursor: pointer; padding: 6px;
    }
    .register-skip:hover { color: var(--text, #e8e8e8); }
    .register-message {
      margin-top: 14px; font-size: 12.5px; text-align: center; min-height: 18px;
    }
    .register-message.error { color: #f44; }
    .register-message.ok { color: #4caf50; }
  </style>
</head>
<body>
  <div class="register-card">
    <div class="register-header">
      <div class="register-logo">SC</div>
      <h1 class="register-title">欢迎使用 SimChat</h1>
      <p class="register-sub">先登记一下你的基本信息，之后可以随时在设置里修改</p>
    </div>

    <form id="register-form" autocomplete="off">
      <div class="register-field">
        <label>用户名 <span class="req">*</span></label>
        <input type="text" name="username" placeholder="你希望 SimChat 怎么称呼你" required maxlength="32">
      </div>

      <div class="register-field optional">
        <label>生日 <span class="opt">（可选，格式 YYYY-MM-DD）</span></label>
        <input type="date" name="birthday">
      </div>

      <div class="register-field optional">
        <label>紧急联系人 <span class="opt">（可选）</span></label>
        <input type="text" name="emergency_contact" placeholder="姓名 / 电话">
      </div>

      <div class="register-divider">服务商 API</div>
      <p class="register-provider-hint">你的 SimChat 已经配置好 API 了，<br>想改的话之后在主界面点「连接服务商」。</p>

      <div class="register-actions">
        <button type="submit" class="register-submit" id="register-submit">完成注册 →</button>
        <button type="button" class="register-skip" id="register-skip">稍后再填，先进去看看</button>
      </div>

      <div class="register-message" id="register-message"></div>
    </form>
  </div>

  <script>
    const form = document.getElementById("register-form");
    const submitBtn = document.getElementById("register-submit");
    const skipBtn = document.getElementById("register-skip");
    const msg = document.getElementById("register-message");

    function setMsg(text, cls) {
      msg.textContent = text || "";
      msg.className = "register-message" + (cls ? " " + cls : "");
    }

    async function apiSaveProfile(payload) {
      const r = await fetch("/api/profile", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || "保存失败");
      return data;
    }

    async function enterApp() {
      setMsg("正在进入 SimChat…", "ok");
      setTimeout(() => { window.location.href = "/"; }, 400);
    }

    // 提交注册
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const formData = new FormData(form);
      const payload = {
        username: (formData.get("username") || "").trim(),
        birthday: (formData.get("birthday") || "").trim(),
        emergency_contact: (formData.get("emergency_contact") || "").trim(),
      };
      if (!payload.username) { setMsg("用户名不能为空", "error"); return; }

      submitBtn.disabled = true;
      try {
        await apiSaveProfile(payload);
        await enterApp();
      } catch (err) {
        setMsg(err.message, "error");
        submitBtn.disabled = false;
      }
    });

    // 跳过：写个默认用户名直接进入
    skipBtn.addEventListener("click", async () => {
      skipBtn.disabled = true;
      try {
        await apiSaveProfile({ username: "User" });
        await enterApp();
      } catch (err) {
        setMsg(err.message, "error");
        skipBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
